name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # Hashed/static assets (immutable) → cache 1 year.
      # Exclude HTML, JSON and the sitemap/robots, which are not fingerprinted
      # and must be revalidated when content changes.
      - name: Sync immutable assets
        run: |
          aws s3 sync dist/ s3://$BUCKET/ --delete \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.xml" \
            --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # HTML → always revalidate
      - name: Sync HTML
        run: |
          aws s3 sync dist/ s3://$BUCKET/ \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # Data / sitemap / robots → short cache, revalidate so updates propagate
      - name: Sync data & metadata
        run: |
          aws s3 sync dist/ s3://$BUCKET/ \
            --exclude "*" \
            --include "*.json" --include "*.xml" --include "robots.txt" \
            --cache-control "public,max-age=3600,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id $DIST --paths "/*"
        env:
          DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
