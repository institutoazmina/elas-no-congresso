name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - astro.config.mjs
      - package.json
      - package-lock.json
      - public/**
      - scripts/**
      - src/**
      - tsconfig.json
  # The API admin dispatches this on every CMS save.
  repository_dispatch:
    types: [cms-content-updated]
  # Manual run, e.g. to take down pages right after unapproving propositions.
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

# One deploy at a time: a running deploy is never cancelled. GitHub keeps a
# single pending run per group, so a burst of saves collapses into one queued
# build, which reads the latest content when it starts.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_DEPLOY_TYPE: s3
      RCLONE_CONFIG_DEPLOY_PROVIDER: AWS
      RCLONE_CONFIG_DEPLOY_ENV_AUTH: "true"
      RCLONE_CONFIG_DEPLOY_REGION: us-east-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restore after npm ci, which removes node_modules. Each successful run
      # saves a fresh snapshot; compatible earlier runs supply the warm cache.
      - name: Cache generated pages
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-site-output-v2-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-site-output-v2-${{ hashFiles('package-lock.json') }}-

      - name: Check unused code, assets and tests
        run: npm run check

      - name: Build
        run: npm run build
        env:
          OG_IMAGE_BASE_URL: https://www.elasnocongresso.com.br

      - name: Test generated site before deployment
        run: npm run test:build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Install rclone
        env:
          RCLONE_VERSION: 1.75.2
        run: |
          archive="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${archive}"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  ${archive}" \
            | sha256sum --check -
          unzip -q "$archive"
          sudo install -m 0755 \
            "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone

      # Hashed build files → cache 1 year. Public assets have stable URLs.
      # Exclude HTML, JSON and the sitemap/robots, which are not fingerprinted
      # and must be revalidated when content changes. Author og.png images and
      # CMS images (cms/) are published by the API straight to the bucket:
      # never delete them here.
      - name: Sync immutable assets
        run: |
          rclone sync dist/ "deploy:${BUCKET}" \
            --checksum --fast-list --delete-after --s3-no-check-bucket \
            --transfers 64 --checkers 64 \
            --exclude "/assets/**" \
            --exclude "/cms/**" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "**/og.png" \
            --exclude "*.xml" \
            --exclude "/robots.txt" \
            --header-upload "Cache-Control: public,max-age=31536000,immutable"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # Stable public asset URLs → cache 1 hour, then revalidate.
      - name: Sync public assets
        run: |
          rclone sync dist/assets/ "deploy:${BUCKET}/assets" \
            --checksum --fast-list --delete-after --s3-no-check-bucket \
            --transfers 64 --checkers 64 \
            --header-upload "Cache-Control: public,max-age=3600,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # HTML → always revalidate. Sync removes pages the build no longer
      # generates (e.g. propositions unapproved in the admin); only HTML is
      # touched, so og.png and other files published by the API stay.
      - name: Sync HTML
        run: |
          rclone sync dist/ "deploy:${BUCKET}" \
            --checksum --fast-list --delete-after --s3-no-check-bucket \
            --transfers 64 --checkers 64 \
            --include "*.html" \
            --header-upload "Cache-Control: public,max-age=0,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # Data / sitemap / robots → short cache, revalidate so updates propagate
      - name: Sync data & metadata
        run: |
          rclone copy dist/ "deploy:${BUCKET}" \
            --checksum --fast-list --s3-no-check-bucket \
            --transfers 64 --checkers 64 \
            --include "*.json" --include "*.xml" --include "/robots.txt" \
            --header-upload "Cache-Control: public,max-age=3600,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
        env:
          DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
