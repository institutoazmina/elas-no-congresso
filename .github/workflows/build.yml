name: Build & Deploy

on:
  push:
    branches: [main]
  # Manual run, e.g. to take down pages right after unapproving propositions.
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restore after npm ci, which removes node_modules. Each successful run
      # saves a fresh snapshot; compatible earlier runs supply the warm cache.
      - name: Cache generated pages
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-site-output-v2-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-site-output-v2-${{ hashFiles('package-lock.json') }}-

      - name: Check unused code, assets and tests
        run: npm run check

      - name: Build
        run: npm run build
        env:
          OG_IMAGE_BASE_URL: https://www.elasnocongresso.com.br

      - name: Test generated site before deployment
        run: npm run test:build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # ~15k small files: the CLI default of 10 parallel requests dominates the sync time.
      - name: Tune S3 transfers
        run: aws configure set default.s3.max_concurrent_requests 64

      # Hashed build files → cache 1 year. Public assets have stable URLs.
      # Exclude HTML, JSON and the sitemap/robots, which are not fingerprinted
      # and must be revalidated when content changes. Author og.png images and
      # CMS images are published by the API straight to the bucket: never delete them here.
      - name: Sync immutable assets
        run: |
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude "assets/*" \
            --exclude "cms/*" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*/og.png" \
            --exclude "*.xml" \
            --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # Stable public asset URLs → cache 1 hour, then revalidate.
      - name: Sync public assets
        run: |
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" --delete \
            --cache-control "public,max-age=3600,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # HTML → always revalidate. --delete removes pages the build no longer
      # generates (e.g. propositions unapproved in the admin); only HTML is
      # touched, so og.png and other files published by the API stay.
      - name: Sync HTML
        run: |
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      # Data / sitemap / robots → short cache, revalidate so updates propagate
      - name: Sync data & metadata
        run: |
          aws s3 sync dist/ "s3://$BUCKET/" \
            --exclude "*" \
            --include "*.json" --include "*.xml" --include "robots.txt" \
            --cache-control "public,max-age=3600,must-revalidate"
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
        env:
          DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
